<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Trace — OSINT Graph Demo</title>
  <style>
    :root {
      --bg: #090d18;
      --bg-2: #0e1424;
      --panel: rgba(18, 26, 45, .82);
      --panel-solid: #121a2d;
      --panel-soft: rgba(30, 42, 68, .62);
      --line: rgba(153, 174, 214, .16);
      --line-strong: rgba(153, 174, 214, .28);
      --text: #edf3ff;
      --muted: #8d9ab5;
      --dim: #61708d;
      --accent: #6ee7d1;
      --accent-2: #7aa7ff;
      --warning: #f8c86d;
      --danger: #ff7890;
      --shadow: 0 18px 60px rgba(0, 0, 0, .28);
      --radius: 18px;
      --radius-sm: 12px;
      --sidebar: 240px;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    [data-theme="light"] {
      --bg: #edf2fa;
      --bg-2: #f7f9fd;
      --panel: rgba(255, 255, 255, .84);
      --panel-solid: #ffffff;
      --panel-soft: rgba(226, 233, 246, .76);
      --line: rgba(40, 57, 87, .14);
      --line-strong: rgba(40, 57, 87, .26);
      --text: #17233b;
      --muted: #62718c;
      --dim: #8793a8;
      --shadow: 0 18px 60px rgba(53, 75, 118, .14);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
    body { overflow-x: hidden; }
    button, input, textarea, select { font: inherit; }
    button { border: 0; cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .app-bg {
      position: fixed; inset: 0; pointer-events: none; overflow: hidden;
      background: radial-gradient(circle at 78% 5%, rgba(91, 129, 255, .16), transparent 34%),
                  radial-gradient(circle at 20% 90%, rgba(54, 194, 177, .09), transparent 30%);
    }
    .app-bg:after {
      content: ""; position: absolute; inset: 0; opacity: .22;
      background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 48px 48px; mask-image: linear-gradient(to bottom, black, transparent 80%);
    }
    [data-theme="light"] .app-bg:after { opacity: .16; background-image: linear-gradient(rgba(70, 91, 130, .08) 1px, transparent 1px), linear-gradient(90deg, rgba(70, 91, 130, .08) 1px, transparent 1px); }
    .shell { position: relative; display: flex; min-height: 100vh; }
    .sidebar {
      position: fixed; z-index: 10; inset: 0 auto 0 0; width: var(--sidebar); padding: 24px 14px;
      display: flex; flex-direction: column; background: rgba(10, 15, 28, .72); border-right: 1px solid var(--line);
      backdrop-filter: blur(24px);
    }
    [data-theme="light"] .sidebar { background: rgba(248, 250, 255, .78); }
    .brand { display: flex; align-items: center; gap: 11px; padding: 3px 12px 28px; }
    .brand-mark { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 10px; color: #07121b; font-weight: 900; background: linear-gradient(135deg, var(--accent), #a7bfff); box-shadow: 0 0 26px rgba(110,231,209,.24); }
    .brand-name { font-size: 16px; font-weight: 750; letter-spacing: .05em; }
    .brand-sub { color: var(--muted); font-size: 10px; margin-top: 2px; letter-spacing: .09em; text-transform: uppercase; }
    .nav { display: grid; gap: 5px; }
    .nav-btn { display: flex; align-items: center; gap: 12px; min-height: 43px; padding: 0 13px; color: var(--muted); background: transparent; border-radius: 12px; text-align: left; transition: .2s ease; }
    .nav-btn:hover { color: var(--text); background: var(--panel-soft); }
    .nav-btn.active { color: var(--text); background: linear-gradient(90deg, rgba(110,231,209,.14), rgba(122,167,255,.08)); box-shadow: inset 2px 0 var(--accent); }
    .nav-icon, .quick-icon, .icon-btn, .tool-btn, .canvas-zoom button, .close-btn, .small-btn { font-family: "Segoe UI Symbol", "Noto Sans Symbols 2", "Arial Unicode MS", system-ui, sans-serif; }
    .nav-icon { width: 18px; text-align: center; color: currentColor; font-size: 16px; }
    .sidebar-bottom { margin-top: auto; }
    .demo-badge { margin: 0 10px 13px; padding: 12px; border: 1px solid rgba(110,231,209,.2); border-radius: 14px; background: rgba(110,231,209,.06); }
    .demo-badge strong { display: block; font-size: 12px; color: var(--accent); }
    .demo-badge span { display: block; margin-top: 4px; font-size: 11px; color: var(--muted); line-height: 1.4; }
    .main { width: calc(100% - var(--sidebar)); margin-left: var(--sidebar); min-height: 100vh; padding: 26px clamp(18px, 4vw, 56px) 60px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; max-width: 1400px; margin: 0 auto 32px; min-height: 40px; }
    .breadcrumbs { color: var(--muted); font-size: 13px; }
    .breadcrumbs b { color: var(--text); font-weight: 650; }
    .top-actions { display: flex; align-items: center; gap: 9px; }
    .icon-btn, .ghost-btn, .primary-btn, .danger-btn, .small-btn {
      min-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 13px; border-radius: 11px; transition: .2s ease;
    }
    .icon-btn { width: 38px; padding: 0; color: var(--muted); background: var(--panel-soft); border: 1px solid var(--line); font-size: 21px; }
    .icon-btn:hover, .ghost-btn:hover, .small-btn:hover { color: var(--text); border-color: var(--line-strong); transform: translateY(-1px); }
    .ghost-btn, .small-btn { color: var(--muted); border: 1px solid var(--line); background: rgba(255,255,255,.025); }
    .primary-btn { color: #08121b; font-weight: 750; background: linear-gradient(135deg, var(--accent), #a3e8dc); box-shadow: 0 9px 25px rgba(110,231,209,.15); }
    .primary-btn:hover { transform: translateY(-1px); filter: brightness(1.05); }
    .danger-btn { color: #ffdbe1; border: 1px solid rgba(255,120,144,.28); background: rgba(255,120,144,.11); }
    .danger-btn:hover { background: rgba(255,120,144,.18); }
    .content { max-width: 1400px; margin: 0 auto; }
    .view { animation: view-in .25s ease both; }
    @keyframes view-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    .page-title { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; margin-bottom: 25px; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(26px, 3vw, 38px); line-height: 1.05; letter-spacing: -.045em; }
    h2 { font-size: 21px; letter-spacing: -.025em; }
    h3 { font-size: 15px; }
    .eyebrow { margin-bottom: 9px; color: var(--accent); font-size: 11px; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
    .subtitle { margin-top: 10px; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .grid { display: grid; gap: 16px; }
    .dashboard-grid { grid-template-columns: repeat(12, 1fr); }
    .card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow); backdrop-filter: blur(20px); }
    button, input, textarea, select, .card, .node, .tool-btn, .type-btn, .setting-row, .admin-nav button, .modal, .modal-backdrop, .editor-side, .canvas-zoom button, .post, .graph-card, .quick-card { transition: transform .22s cubic-bezier(.22,1,.36,1), opacity .22s ease, background-color .22s ease, border-color .22s ease, box-shadow .22s ease, color .18s ease; }
    .node { transition: left .28s cubic-bezier(.22,1,.36,1), top .28s cubic-bezier(.22,1,.36,1), transform .22s cubic-bezier(.22,1,.36,1), opacity .22s ease, box-shadow .22s ease, border-color .22s ease; will-change: left, top, transform; touch-action: none; }
    .node.reveal { animation: node-reveal .32s cubic-bezier(.22,1,.36,1) both; }
    .node.selected { transform: translateZ(0) scale(1.025); }
    @keyframes node-reveal { from { opacity: 0; transform: scale(.82) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .canvas-stage { transition: transform .24s cubic-bezier(.22,1,.36,1); }
    .edge-hit { transition: d .28s cubic-bezier(.22,1,.36,1), opacity .2s ease; }
    .modal-backdrop { animation: fade-in .18s ease both; }
    .modal { animation: modal-in .24s cubic-bezier(.22,1,.36,1) both; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes modal-in { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }

    .welcome-card { grid-column: span 8; min-height: 244px; padding: 28px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; position: relative; }
    .welcome-card:after { content: ""; position: absolute; width: 300px; height: 300px; right: -70px; top: -95px; border-radius: 50%; border: 1px solid rgba(110,231,209,.16); box-shadow: 0 0 0 30px rgba(110,231,209,.03), 0 0 0 60px rgba(110,231,209,.02); pointer-events: none; }
    .welcome-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .metric-card { grid-column: span 4; padding: 22px; display: flex; flex-direction: column; justify-content: space-between; min-height: 244px; }
    .metric-number { margin-top: 17px; font-size: 49px; line-height: 1; letter-spacing: -.07em; }
    .metric-meta { color: var(--muted); font-size: 12px; }
    .quick-card { grid-column: span 4; min-height: 152px; padding: 19px; }
    .quick-card.wide { grid-column: span 8; }
    .quick-card button { width: 100%; height: 100%; display: flex; align-items: flex-start; justify-content: space-between; color: var(--text); background: none; text-align: left; }
    .quick-icon { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 12px; color: var(--accent); background: rgba(110,231,209,.07); font-size: 19px; }
    .muted { color: var(--muted); }
    .section-head { display: flex; justify-content: space-between; align-items: center; margin: 30px 0 14px; }
    .section-head .muted { font-size: 13px; }
    .graph-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 15px; }
    .graph-card { overflow: hidden; display: flex; flex-direction: column; min-height: 198px; }
    .graph-thumb { height: 98px; position: relative; overflow: hidden; border-bottom: 1px solid var(--line); background: radial-gradient(circle at 50% 50%, rgba(122,167,255,.11), transparent 60%); }
    .graph-thumb svg { width: 100%; height: 100%; }
    .graph-body { padding: 15px; display: flex; flex: 1; flex-direction: column; }
    .graph-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 700; }
    .graph-meta { display: flex; gap: 12px; margin-top: 8px; color: var(--muted); font-size: 11px; }
    .graph-footer { display: flex; gap: 8px; margin-top: auto; padding-top: 16px; }
    .graph-footer button { flex: 1; min-height: 34px; font-size: 12px; }
    .empty { padding: 54px 24px; text-align: center; border: 1px dashed var(--line-strong); border-radius: var(--radius); }
    .empty .empty-mark { width: 54px; height: 54px; display: grid; place-items: center; margin: 0 auto 15px; border: 1px solid var(--line); border-radius: 17px; color: var(--accent); font-size: 24px; }
    .empty p { margin: 9px 0 17px; color: var(--muted); font-size: 13px; }
    .pagination { display: flex; justify-content: center; align-items: center; gap: 7px; margin-top: 24px; }
    .pagination button { width: 34px; height: 34px; border-radius: 9px; color: var(--muted); background: var(--panel-soft); }
    .pagination button.active { color: #07121b; background: var(--accent); }
    .pagination button:disabled { opacity: .35; cursor: default; }
    .tabs { display: flex; gap: 6px; padding: 4px; border-radius: 12px; background: var(--panel-soft); }
    .tab { padding: 9px 13px; border-radius: 9px; color: var(--muted); background: transparent; font-size: 12px; }
    .tab.active { color: var(--text); background: var(--panel-solid); box-shadow: 0 4px 15px rgba(0,0,0,.12); }
    .feed-list { display: grid; gap: 14px; max-width: 870px; }
    .post { padding: 17px; }
    .post-head { display: flex; justify-content: space-between; gap: 15px; }
    .author { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 35px; height: 35px; display: grid; place-items: center; flex: none; border-radius: 50%; color: #08121b; font-size: 12px; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
    .author b { display: block; font-size: 13px; }
    .author span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .post-title { margin: 16px 0 12px; font-size: 16px; }
    .post-preview { height: 170px; border: 1px solid var(--line); overflow: hidden; border-radius: 13px; background: #0d1527; }
    .post-preview svg { width: 100%; height: 100%; }
    .post-actions { display: flex; gap: 8px; margin-top: 13px; align-items:center; }
    .post-action-icon { width:34px; height:34px; padding:0; }
    .post-action-icon.active { color:var(--accent); border-color:rgba(110,231,209,.45); background:rgba(110,231,209,.1); }
    .feed-pin-mark { display:inline-flex; vertical-align:-2px; margin-right:5px; color:var(--warning); }
    .post-menu-panel button { display:flex; align-items:center; gap:9px; }
    .post-menu-panel button svg { flex:none; }
    .feed-list.feed-updating { opacity:.72; transform:translateY(1px); }
    .feed-remove-out { opacity:0 !important; transform:translateY(-8px) scale(.98) !important; }
    .feed-remove-out { opacity:0 !important; transform:translateY(-8px) scale(.98) !important; }
    .vote-btn { min-height: 34px; padding: 0 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 9px; background: transparent; font-size: 12px; }
    .vote-btn.active.like { color: var(--accent); border-color: rgba(110,231,209,.45); background: rgba(110,231,209,.1); }
    .vote-btn.active.dislike { color: var(--danger); border-color: rgba(255,120,144,.45); background: rgba(255,120,144,.1); }
    .settings-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(280px, .7fr); gap: 16px; }
    .setting-card { padding: 22px; }
    .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 25px; padding: 17px 0; border-bottom: 1px solid var(--line); }
    .setting-row:last-child { border-bottom: 0; }
    .setting-label b { display: block; font-size: 13px; }
    .setting-label span { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; }
    .select { min-height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--text); background: var(--panel-soft); }
    .danger-zone { border-color: rgba(255,120,144,.25); }
    .danger-zone h3 { color: var(--danger); }
    .admin-layout { display: grid; grid-template-columns: 185px minmax(0, 1fr); gap: 16px; }
    .admin-nav { padding: 9px; align-self: start; }
    .admin-nav button { width: 100%; min-height: 38px; padding: 0 10px; color: var(--muted); background: transparent; border-radius: 9px; text-align: left; font-size: 12px; }
    .admin-nav button.active { color: var(--text); background: var(--panel-soft); }
    .admin-main { min-width: 0; }
    .admin-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
    .admin-stat { padding: 17px; }
    .admin-stat strong { display: block; margin-top: 12px; font-size: 27px; }
    .admin-stat span { color: var(--muted); font-size: 11px; }
    .admin-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .admin-table th { padding: 12px 10px; color: var(--muted); font-size: 10px; font-weight: 600; text-align: left; border-bottom: 1px solid var(--line); }
    .admin-table td { padding: 14px 10px; border-bottom: 1px solid var(--line); }
    .admin-table tr:last-child td { border-bottom: 0; }
    .row-actions { display: flex; justify-content: flex-end; gap: 6px; }
    .row-actions button { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); background: transparent; }
    .pin { color: var(--warning); }
    .editor-shell { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; background: var(--bg); }
    .editor-top { height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 18px; border-bottom: 1px solid var(--line); background: rgba(11,16,30,.82); backdrop-filter: blur(18px); }
    [data-theme="light"] .editor-top { background: rgba(248,250,255,.88); }
    .editor-title { min-width: 0; display: flex; align-items: center; gap: 11px; }
    .editor-title input { width: min(33vw, 360px); min-height: 36px; padding: 0 11px; border: 1px solid transparent; border-radius: 9px; color: var(--text); background: transparent; font-size: 15px; font-weight: 700; }
    .editor-title input:hover, .editor-title input:focus { border-color: var(--line); background: var(--panel-soft); outline: none; }
    .editor-tools { display: flex; align-items: center; gap: 7px; }
    .publish-tool { border-color: rgba(110,231,209,.35); }
    .publish-tool.active { transform: translateY(-1px) scale(1.03); box-shadow: 0 0 0 4px rgba(110,231,209,.10); }

    .tool-btn { min-height: 36px; padding: 0 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 9px; background: var(--panel-soft); font-size: 12px; }
    .tool-btn:hover, .tool-btn.active { color: var(--text); border-color: var(--line-strong); }
    .tool-btn.active { color: var(--accent); background: rgba(110,231,209,.1); }
    .editor-body { position: relative; display: flex; flex: 1; min-height: 0; }
    /* Interaction fixes */
    .canvas-wrap { -webkit-user-select: none; user-select: none; }
    .canvas-stage { will-change: transform; }
    .node { touch-action: none; }
    .mini-preview { height: 108px; overflow: hidden; border-bottom: 1px solid var(--line); background: rgba(8,14,27,.7); border-radius: 12px 12px 0 0; }
    [data-theme="light"] .mini-preview { background: rgba(240,244,250,.9); }
    .mini-preview svg { width: 100%; height: 100%; display: block; }
    .feed-list.compact { grid-template-columns: repeat(2,minmax(0,1fr)); max-width: 1100px; }
    .feed-list.compact .post-preview { height: 105px; }
    .feed-list.compact .post { min-width: 0; }
    .feed-layout-tools { display:flex; gap:6px; align-items:center; }
    .view-toggle { display:inline-flex; border:1px solid var(--line); border-radius:10px; padding:3px; background:var(--panel-soft); }
    .view-toggle button { width:31px; height:28px; color:var(--muted); border-radius:7px; background:transparent; }
    .view-toggle button.active { color:var(--text); background:var(--panel); }
    .branch-preview { padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--panel-soft); }
    .branch-preview-label { color:var(--muted); font-size:10px; margin-bottom:7px; text-transform:uppercase; letter-spacing:.08em; }
    .branch-preview-card { min-height:62px; padding:11px; border:1px solid rgba(110,231,209,.28); border-radius:10px; background:rgba(20,31,54,.72); }
    [data-theme="light"] .branch-preview-card { background:rgba(255,255,255,.75); }
    .branch-preview-card b { display:block; font-size:12px; }
    .branch-preview-card span { display:block; margin-top:5px; color:var(--muted); font-size:10px; white-space:pre-wrap; overflow:hidden; max-height:30px; }
    .post-menu-panel { display:grid; gap:8px; }
    @media (max-width: 760px) { .feed-list.compact { grid-template-columns:1fr 1fr; gap:8px; } .feed-list.compact .post-head { padding-bottom:6px; } .feed-list.compact .post-title { font-size:13px; } }

    .canvas-wrap { position: relative; flex: 1; min-width: 0; overflow: hidden; touch-action: none; background-color: #0b1120; background-image: radial-gradient(rgba(141,157,193,.24) 1px, transparent 1px); background-size: 24px 24px; }
    [data-theme="light"] .canvas-wrap { background-color: #eef3fa; background-image: radial-gradient(rgba(85,105,143,.24) 1px, transparent 1px); }
    .canvas-stage { position: absolute; inset: 0; transform-origin: 0 0; }
    .edges { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .edge-hit { pointer-events: stroke; cursor: pointer; }
    .node { position: absolute; min-width: 160px; max-width: 250px; padding: 12px 13px; border: 1px solid rgba(164,190,238,.24); border-radius: 13px; color: var(--text); background: rgba(20,31,54,.9); box-shadow: 0 12px 30px rgba(0,0,0,.26); cursor: grab; user-select: none; transform: translate(-50%, -50%); }
    [data-theme="light"] .node { background: rgba(255,255,255,.93); }
    .node:active { cursor: grabbing; }
    .node.selected { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(110,231,209,.12), 0 15px 30px rgba(0,0,0,.25); }
    .node.connect-source { border-color: var(--warning); box-shadow: 0 0 0 3px rgba(248,200,109,.14); }
    .node-kicker { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; color: var(--muted); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; }
    .node-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px currentColor; }
    .node-title { font-size: 13px; font-weight: 750; line-height: 1.25; }
    .node-preview { max-height: 76px; overflow: hidden; margin-top: 9px; color: var(--muted); font-size: 10px; line-height: 1.45; }
    .node-table { width: 100%; margin-top: 9px; border-collapse: collapse; font-size: 10px; }
    .node-table td { padding: 3px 4px 3px 0; border-top: 1px solid var(--line); }
    .node-table td:first-child { color: var(--muted); }
    .node-media { width: 100%; height: 65px; object-fit: cover; margin-top: 9px; border-radius: 8px; }
    .canvas-help { position: absolute; left: 18px; bottom: 18px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); background: rgba(9,13,24,.68); backdrop-filter: blur(10px); font-size: 10px; pointer-events: none; }

      for (let i=values.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [values[i],values[j]]=[values[j],values[i]]; }
      return values.join("");
    }
    async function generateLinkCode() {

        if (options.body && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
        const res = await fetch(API_BASE + path, { ...options, headers });
        if (!res.ok) { let detail = `HTTP ${res.status}`; try { const j = await res.json(); detail = j.detail || detail; } catch {} throw new Error(detail); }
        return res.status === 204 ? null : res.json();
      },

      graphs() { return this.request("/api/graphs"); },
      feed() { return this.request("/api/feed"); },
      favorites() { return this.request("/api/favorites"); },

        state.graphs = Array.isArray(graphs) ? graphs : (Array.isArray(graphs?.graphs) ? graphs.graphs : (Array.isArray(graphs?.items) ? graphs.items : []));

        state.settings = {...defaultSettings, ...(settings?.settings || {})};

        const serverLinked = !!(me?.linked || me?.link_verified || me?.linked_code || me?.is_linked);

        eye:`<path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5Z"/><circle cx="12" cy="12" r="2.5"/>`,

    }

    function renderNode(node, readonly) {
      const colors = { ordinary: "#6ee7d1", expandable: "#7aa7ff", table: "#b29cff", text: "#f8c86d", media: "#ff9cba" };
      const rows = (node.rows || []).slice(0, node.collapsed ? 3 : 30);
      const preview = node.type === "text" ? `<div class="node-preview">${esc(node.text || "Информационная заметка")}</div>` :
        node.type === "media" ? (node.media ? `<img class="node-media" src="${node.media}" alt="">` : `<div class="node-preview">${esc(node.text || "Медиа-узел")}</div>`) :
        node.type === "table" || node.type === "expandable" ? `<table class="node-table">${rows.map(row=>`<tr><td>${esc(row[0])}</td><td>${esc(row[1])}</td></tr>`).join("")}</table>${node.collapsed && (node.rows||[]).length>3 ? `<div class="node-preview">+ ${(node.rows||[]).length-3} more</div>` : ""}` :
        node.text ? `<div class="node-preview">${esc(node.text)}</div>` : "";
      const childOpen = node.type === "expandable" && (()=>{const g = state.view === "viewer" ? (state.feed.find(p=>p.id===state.viewingGraphId)?.graph || getGraph(state.viewingGraphId)) : getGraph(state.editingGraphId); return !!(g && findExpandableChild(g,node).some(n=>!n.hidden && !n._hiding));})();
      return `<div class="node ${node._justRevealed?"reveal":""} ${node._hiding?"collapse-out":""} ${state.selectedNodeId===node.id?"selected":""} ${state.connectSource===node.id?"connect-source":""}" data-node="${node.id}" style="left:${node.x}px;top:${node.y}px">
        <div class="node-kicker"><span class="node-dot" style="color:${colors[node.type]};background:${colors[node.type]}"></span>${nodeTypeLabel(node.type)}</div>
        <div class="node-title">${esc(node.title || "Без названия")}</div>
        ${preview}
        ${node.type==="expandable" ? `<div class="expand-hint ${childOpen?"open":""}">${childOpen ? icon("chevronUp",13) : icon("chevronDown",13)}<span>${childOpen ? "Скрыть связь" : "Раскрыть связь"}</span></div>` : ""}
      </div>`;
    }
    function renderEditorSide(graph, selected, readonly) {
      if (readonly) return `<div class="side-block"><div class="side-label">${t("selected")}</div>${selected ? `<h3>${esc(selected.title)}</h3><p class="side-tip" style="margin-top:8px">${nodeTypeLabel(selected.type)}</p><div class="node-actions" style="margin-top:14px"><button class="primary-btn" data-action="node-info" data-id="${selected.id}">${t("info")}</button></div>` : `<p class="side-tip">${t("noSelection")}</p>`}</div><div class="side-block"><div class="side-label">${t("graphs")}</div><p class="side-tip">${graph.nodes.length} ${t("branches")} · ${graph.edges.length} ${t("connections")}</p></div>`;
      return `<div class="side-block"><div class="side-label">${t("selected")}</div>${selected ? `<h3>${esc(selected.title)}</h3><p class="side-tip" style="margin-top:8px">${nodeTypeLabel(selected.type)}</p><div class="node-actions" style="margin-top:14px"><button class="primary-btn" data-action="edit-node" data-id="${selected.id}">${t("edit")}</button><button class="danger-btn" data-action="delete-node" data-id="${selected.id}">${t("deleteNode")}</button></div>` : `<p class="side-tip">${t("noSelection")}</p>`}</div><div class="side-block"><div class="side-label">${t("addNode")}</div><div class="type-grid">${["ordinary","expandable","table","text","media"].map(type=>`<button class="type-btn" data-action="add-node-type" data-type="${type}"><span class="type-icon">${icon(type==="ordinary"?"node":type==="expandable"?"chevronDown":type==="table"?"table":type==="text"?"text":"image",17)}</span><span><b>${nodeTypeLabel(type)}</b>${type==="ordinary"?t("simplePoint"):type==="expandable"?t("moreDetails"):type==="table"?t("structuredData"):type==="text"?t("freeNote"):t("imageNode")}</span></button>`).join("")}</div></div><div class="side-block"><div class="side-label">${t("graphs")}</div><p class="side-tip">${graph.nodes.length} ${t("branches")} · ${graph.edges.length} ${t("connections")}<br><br><kbd>${t("dragNodes")}</kbd> · <kbd>⌁</kbd> ${t("connect")}</p></div>`;
    }
    function bindFeedList() {
      $(".feed-list")?.querySelectorAll("[data-action]").forEach(btn => {
        btn.addEventListener("click", handleAction);
      });
    }

    function bindShell() {
      $$("[data-nav]").forEach(btn => btn.addEventListener("click", () => setView(btn.dataset.nav)));
      $$("[data-action]").forEach(btn => btn.addEventListener("click", handleAction));
      $$("[data-page]").forEach(btn => btn.addEventListener("click", () => { if(!btn.disabled) { state.page = Number(btn.dataset.page); render(); } }));
      $$("[data-feed-tab]").forEach(btn => btn.addEventListener("click", () => { state.feedTab = btn.dataset.feedTab; refreshFeedUI({animate:true}); }));
      $$("[data-feed-layout]").forEach(btn => btn.addEventListener("click", () => { state.feedLayout = btn.dataset.feedLayout; refreshFeedUI({animate:true}); }));
      $$("[data-admin-section]").forEach(btn => btn.addEventListener("click", () => { state.admin.section = btn.dataset.adminSection; saveAdmin(); render(); }));
      $$("[data-setting]").forEach(select => select.addEventListener("change", () => { state.settings[select.dataset.setting] = select.value; saveSettings(); render();; }));
    }
    function handleAction(event) {
      const btn = event.currentTarget, action = btn.dataset.action, id = btn.dataset.id;
      if (action === "link-account") { state.modal = {type: state.linked ? "unlink-account" : "link-account"}; renderModal(); }
      else if (action === "create-graph") openCreateGraph();
      else if (action === "open-viewer") enterEditor(id,true);
      else if (action === "delete-graph" || action === "admin-delete") confirmDeleteGraph(id);
      else if (action === "admin-open") { if (!isAdmin()) return toast("Недостаточно прав"); state.view = "admin"; state.admin.section = "stats"; saveAdmin(); render(); }
      else if (action === "theme-toggle") { state.settings.theme = state.settings.theme === "dark" ? "light" : state.settings.theme === "light" ? "system" : "dark"; saveSettings(); render();; }
      else if (action === "close-editor" || action === "close-viewer") { resetEditorInteractions(); state.view = "graphs"; state.selectedNodeId=null; state.connectMode=false; state.connectSource=null; state.sideOpen=false; state.editorSession++; render(); }
      else if (action === "delete-all") confirmDeleteAll();
      else if (action === "vote") vote(id, Number(btn.dataset.vote));
      else if (action === "view-feed-graph") enterEditor(id,true);
      else if (action === "admin-pin") { toggleFeedPin(id); }
      else if (action === "admin-open-graph") enterEditor(id,true);
      else if (action === "node-info") openInfo(id);
      else if (action === "edit-node") openNodeModal(id);
      else if (action === "delete-node") deleteNode(id);
      else if (action === "add-node-type") openNodeModal(null, btn.dataset.type);
      else if (action === "post-menu") openPostMenu(id);
      else if (action === "feed-pin") toggleFeedPin(id);
      else if (action === "save-post") toggleSavedPost(id);
      else if (action === "share-post") sharePost(id);
      else if (action === "report-post") openReport(id);
      else if (action === "publish-graph") publishCurrentGraph();
      else if (action === "admin-report-actions") { openAdminReportActions(id); }
      else if (action === "demo-user") { const row = btn.closest("tr"); const cells = row ? row.querySelectorAll("td") : []; state.modal={type:"demo-user",user:{name:cells[0]?.innerText||"Demo user",role:cells[1]?.innerText||"Analyst",posts:cells[2]?.innerText||"0"}}; renderModal(); }
    }
    function openAdminReportActions(reportId) { state.modal={type:"report-actions",reportId}; renderModal(); }
    async function resolveReport(reportId, status="resolved") { const r=state.reports.find(x=>x.id===reportId); if(!r)return; try { await api.adminResolveReport(reportId,status); r.status=status; closeModal(); if(state.view==="admin" && state.admin.section==="moderation") render(); else if(state.view==="feed") refreshFeedUI({animate:true});; } catch(e) { toast("Ошибка модерации"); } }
    async function deleteReportedGraph(reportId) {
      const r=state.reports.find(x=>x.id===reportId); if(!r)return;
      const post=state.feed.find(p=>p.id===r.postId);
      const graphId=r.graphId || post?.graphId;
      if(graphId) { state.graphs=state.graphs.filter(g=>g.id!==graphId); api.adminDeleteGraph(graphId).catch(e=>apiError=e); }
      state.feed=state.feed.filter(p=>p.id!==r.postId && (!graphId || p.graphId!==graphId));
      r.status="resolved";
      saveGraphs(); save(STORAGE.feed,state.feed); save(STORAGE.reports,state.reports);
      closeModal(); render(); ;
    }

    function publishCurrentGraph() {
      const graph = getGraph(state.editingGraphId);
      if (!graph) return;
      const existing = state.feed.find(p => p.graphId === graph.id && p.local);
      const snapshot = clone(graph);
      graph.published = true;
      graph.publishedAt = existing?.createdAt || now();
      graph.updatedAt = now();
      if (existing) {
        existing.title = graph.title;
        existing.graph = snapshot;
        existing.createdAt = existing.createdAt || now();
      } else {
        state.feed.unshift({
          id: uid("post"), graphId: graph.id, title: graph.title, author: "Вы", initials: "В",
          createdAt: now(), likes: 0, dislikes: 0, graph: snapshot, local: true, pinned: !!graph.pinned
        });
      }
      saveGraphs();
      save(STORAGE.feed, state.feed);
      const btn = $("[data-action=\"publish-graph\"]");
      if (btn) {
        btn.classList.add("active");
        setTimeout(() => btn.classList.remove("active"), 260);
      }
      toast(existing ? t("publicationUpdated") : t("published"));
    }

    function toggleFeedPin(id) {
      let graph = getGraph(id);
      let post = null;
      if (!graph) { post = state.feed.find(p => p.id === id); graph = post?.graph; }
      if (!graph) return;
      const next = !(post?.pinned ?? graph.pinned ?? false);
      graph.pinned = next;
      graph.updatedAt = now();
      if (post) {
        post.pinned = next;
        post.graph = clone(graph);
        const localGraph = getGraph(post.graphId);
        if (localGraph) { localGraph.pinned = next; localGraph.updatedAt = graph.updatedAt; saveGraphs(); }
      } else {
        const existing = state.feed.find(p => p.graphId === graph.id && p.local);
        if (next && !existing) state.feed.unshift({id:uid("post"),graphId:graph.id,title:graph.title,author:"Вы",initials:"В",createdAt:now(),likes:0,dislikes:0,graph:clone(graph),local:true,pinned:true});
        if (!next && existing) state.feed=state.feed.filter(p=>p.id!==existing.id);
        if (getGraph(graph.id)) saveGraphs();
      }
      save(STORAGE.feed,state.feed);
      api.syncFeed(state.feed, state.likes).then(v=>{ if(v){state.feed=v.feed||state.feed; state.likes=v.likes||state.likes;} }).catch(e=>apiError=e);
      if (state.view === "feed") refreshFeedUI({animate:true});
      else render();
      toast(next?t("pinFeed"):t("unpinFeed"));
    }

    function toggleSavedPost(postId) {
      if (!state.feed.some(p => p.id === postId)) return;
      if (state.savedPosts[postId]) delete state.savedPosts[postId]; else state.savedPosts[postId] = true;
      save(STORAGE.savedPosts, state.savedPosts);
      api.syncFavorites(state.savedPosts).catch(e=>apiError=e);
      if (state.view === "feed") refreshFeedUI({animate:true});
      
    }

    async function sharePost(postId) {
      const post = state.feed.find(p => p.id === postId); if (!post) return;
      const text = `${post.title} — TRACE`;
      try {
        if (navigator.share) await navigator.share({title: post.title, text});
        else if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(text);
        else { const area=document.createElement("textarea"); area.value=text; document.body.append(area); area.select(); document.execCommand("copy"); area.remove(); }
        ;
      } catch {}
    }

    function openReport(postId) {
      const post = state.feed.find(p => p.id === postId); if (!post) return;
      state.modal = {type:"report", postId}; renderModal();
    }

    async function submitReport(postId) {
      const post = state.feed.find(p => p.id === postId); if (!post) return;
      const reason = $("#report-reason")?.value || "other", details = $("#report-details")?.value?.trim() || "";
      try { const result = await api.report({postId, graphId:post.graphId, title:post.title, reason, details}); state.reports.push({id:result?.id || uid("report"), postId, graphId:post.graphId, title:post.title, reason, details, status:"pending"}); closeModal(); toast(t("reportSent")); }
      catch (_) { toast(t("reportSent")); closeModal(); }
    }

    function vote(postId, direction) {
      const post = state.feed.find(item => item.id === postId); if (!post) return;
      const previous = state.likes[postId] || 0;
      if (previous === direction) { delete state.likes[postId]; direction = 0; }
      else state.likes[postId] = direction;
      if (previous === 1) post.likes--; if (previous === -1) post.dislikes--;
      if (direction === 1) post.likes++; if (direction === -1) post.dislikes++;
      saveLikes(); save(STORAGE.feed, state.feed); if (state.view === "feed") refreshFeedUI({animate:false}); else render();;
    }
    function bindEditor(readonly) {
      const graph = readonly
        ? state.feed.find(p => p.id === state.viewingGraphId)?.graph || getGraph(state.viewingGraphId)
        : getGraph(state.editingGraphId);
      const canvas = $("#canvas-wrap"), stage = $("#canvas-stage");
      if (!graph || !canvas || !stage) return;

      // Every editor render gets a fresh, deterministic interaction state.
      resetEditorInteractions();

      $$('[data-action]', $("#app")).forEach(btn => btn.addEventListener("click", handleAction));
      $$('[data-tool]').forEach(btn => btn.addEventListener("click", () => {
        const tool = btn.dataset.tool;
        if (tool === "close") {
          resetEditorInteractions();
          state.view = readonly ? "graphs" : "graphs";
          state.selectedNodeId = null; state.sideOpen = false; state.connectMode = false; state.connectSource = null;
          render();
        } else if (tool === "side") {
          state.sideOpen = !state.sideOpen;
          renderEditor(readonly);
        } else if (tool === "add") openNodeModal();
        else if (tool === "connect") {
          state.connectMode = !state.connectMode;
          state.connectSource = null;
          renderEditor(readonly);
        } else if (tool === "export") openExportModal();
        else if (tool === "edit-viewer") enterEditor(state.viewingGraphId, false);
      }));

      $$('[data-canvas]').forEach(btn => btn.addEventListener("click", () => {
        const kind = btn.dataset.canvas;
        if (kind === "in") zoomAt(canvas.clientWidth / 2, canvas.clientHeight / 2, 1.18);
        if (kind === "out") zoomAt(canvas.clientWidth / 2, canvas.clientHeight / 2, .85);
        if (kind === "reset") { state.viewport = initialForGraph(graph); applyStage(); }
      }));

      // Node events are intentionally limited to click/double-click.
      // Pointer movement is owned by the canvas so a swipe starting on a card
      // can ALWAYS pan the graph.
      $$(".node", canvas).forEach(nodeEl => {
        nodeEl.addEventListener("click", event => {
          event.stopPropagation();
          if (state.pointer.suppressClick) {
            state.pointer.suppressClick = false;
            return;
          }
          const id = nodeEl.dataset.node;
          const node = graph.nodes.find(n => n.id === id);
          if (!node || node.hidden || node._hiding) return;
          state.selectedNodeId = id;

          if (state.connectMode) {
            handleConnect(id);
            return;
          }
          if (node.type === "expandable") {
            toggleExpandable(graph, id);
          } else if (readonly) {
            openInfo(id);
          } else {
            renderEditor(readonly);
          }
        });
        nodeEl.addEventListener("dblclick", event => {
          event.stopPropagation();
          if (state.pointer.suppressClick) { state.pointer.suppressClick = false; return; }
          const id = nodeEl.dataset.node;
          if (!readonly) openNodeModal(id); else openInfo(id);
        });
      });

      $$(".edge-hit", canvas).forEach(edge => edge.addEventListener("click", event => {
        event.stopPropagation();
        if (!readonly) openEdgeModal(edge.dataset.edge);
      }));

      const DRAG_THRESHOLD = 7;
      const NODE_HOLD_MS = 280;

      canvas.addEventListener("pointerdown", event => {
        if (event.pointerType === "touch" && state.pinch && Object.keys(state.pinch.points).length >= 2) return;

        const nodeEl = event.target.closest?.(".node");
        const nodeId = nodeEl?.dataset.node;
        const node = nodeId ? graph.nodes.find(n => n.id === nodeId) : null;

        if (node) {
          state.selectedNodeId = node.id;
          state.pointer = {
            mode: "pending-node", id: event.pointerId,
            startX: event.clientX, startY: event.clientY,
            originX: state.viewport.x, originY: state.viewport.y,
            nodeX: node.x, nodeY: node.y, nodeId: node.id, nodeEl,
            startedAt: performance.now(), moved: false,
            dragNode: false, suppressClick: false
          };
        } else {
          state.selectedNodeId = null;
          state.sideOpen = false;
          state.pointer = {
            mode: "pan", id: event.pointerId,
            startX: event.clientX, startY: event.clientY,
            originX: state.viewport.x, originY: state.viewport.y,
            nodeX: 0, nodeY: 0, nodeId: null, nodeEl: null,
            startedAt: performance.now(), moved: false,
            dragNode: false, suppressClick: false
          };
        }

        try { canvas.setPointerCapture?.(event.pointerId); } catch {}
      });

      // Update graph edges immediately while nodes are being dragged.
      // The SVG lives inside the same transformed stage as the nodes, so we
      // only need to rewrite the path geometry; no full editor re-render is
      // necessary during the gesture.
      function updateEditorEdges() {
        const byId = Object.fromEntries(graph.nodes.map(n => [n.id, n]));
        $$(".edge-hit", canvas).forEach(hit => {
          const edge = graph.edges.find(e => e.id === hit.dataset.edge);
          if (!edge) return;
          const a = byId[edge.from], b = byId[edge.to];
          if (!a || !b) return;
          const dx = b.x - a.x;
          const bend = Math.max(55, Math.abs(dx) * .28);
          const direction = dx >= 0 ? 1 : -1;
          const d = `M ${a.x} ${a.y} C ${a.x + bend * direction} ${a.y}, ${b.x - bend * direction} ${b.y}, ${b.x} ${b.y}`;
          hit.setAttribute("d", d);
          const glow = hit.nextElementSibling;
          if (glow && glow.tagName?.toLowerCase() === "path") glow.setAttribute("d", d);
        });
      }

      canvas.addEventListener("pointermove", event => {
        if (event.pointerType === "touch" && state.pinch && Object.keys(state.pinch.points).length >= 2) return;
        if (state.pointer.id !== event.pointerId) return;

        const dx = event.clientX - state.pointer.startX;
        const dy = event.clientY - state.pointer.startY;
        const distance = Math.hypot(dx, dy);
        if (distance > DRAG_THRESHOLD) state.pointer.moved = true;

        if (state.pointer.mode === "pending-node") {
          const held = performance.now() - state.pointer.startedAt >= NODE_HOLD_MS;

          if (held && !state.pointer.dragNode) {
            state.pointer.mode = "node";
            state.pointer.dragNode = true;
          } else if (!held && distance > DRAG_THRESHOLD) {
            state.pointer.mode = "pan";
          }
        }

        if (state.pointer.mode === "pan") {
          state.viewport.x = state.pointer.originX + dx;
          state.viewport.y = state.pointer.originY + dy;
          applyStage();
        } else if (state.pointer.mode === "node") {
          const node = graph.nodes.find(n => n.id === state.pointer.nodeId);
          if (node && !readonly) {
            node.x = state.pointer.nodeX + dx / state.viewport.scale;
            node.y = state.pointer.nodeY + dy / state.viewport.scale;
            const el = state.pointer.nodeEl;
            if (el) {
              el.classList.add("dragging");
              el.style.left = node.x + "px";
              el.style.top = node.y + "px";
            }
            // Keep every connected line locked to the node on every pointer
            // frame instead of waiting until pointerup/re-render.
            updateEditorEdges();
          }
        }
      });

      const finishPointer = event => {
        if (state.pointer.id === event.pointerId) {
          const mode = state.pointer.mode;
          const wasMoved = !!state.pointer.moved;
          const wasNode = mode === "node";

          if (wasNode && !readonly) {
            graph.updatedAt = now();
            saveGraphs();
          }
          if (state.pointer.nodeEl) state.pointer.nodeEl.classList.remove("dragging");

          state.pointer.suppressClick = wasMoved;
          state.pointer.mode = null;
          state.pointer.id = null;

          if (wasNode) renderEditor(readonly);
        }
        if (event.pointerType === "touch") handleTouchEnd(event);
      };

      canvas.addEventListener("pointerup", finishPointer);
      canvas.addEventListener("pointercancel", event => {
        if (event.pointerType === "touch") handleTouchEnd(event);
        if (state.pointer.id === event.pointerId) {
          state.pointer.mode = null;
          state.pointer.id = null;
        }
      });

      updateEditorEdges();

      canvas.addEventListener("wheel", event => {
        event.preventDefault();
        const rect = canvas.getBoundingClientRect();
        zoomAt(event.clientX - rect.left, event.clientY - rect.top, event.deltaY < 0 ? 1.1 : .9);
      }, { passive: false });

      // Empty canvas: deselect, close the side panel, and cancel connect mode.
      canvas.addEventListener("click", event => {
        if (event.target.closest?.(".node") || event.target.closest?.(".edge-hit")) return;
        state.selectedNodeId = null;
        state.sideOpen = false;

    function bindModal() {
      $$("[data-modal-close]").forEach(btn=>btn.addEventListener("click",closeModal));
      $$ ("[data-action]", $(".modal")).forEach(btn=>btn.addEventListener("click", e=>{ const a=e.currentTarget.dataset.action, id=e.currentTarget.dataset.id; if(a==="view-feed-graph"){ closeModal(); enterEditor(id,true); } else if(a==="save-post"){ toggleSavedPost(id); closeModal(); } else if(a==="share-post"){ sharePost(id); closeModal(); } else if(a==="report-post"){ closeModal(); openReport(id); } }));
      $$("[data-menu-pin]").forEach(btn=>btn.addEventListener("click",()=>{ toggleFeedPin(btn.dataset.menuPin); closeModal(); }));
      $$("[data-menu-hide]").forEach(btn=>btn.addEventListener("click",()=>{
        const id=btn.dataset.menuHide;
        const card=$("[data-post-card='"+id+"']");
        if(card){ card.classList.add("feed-remove-out"); setTimeout(()=>{ state.feed=state.feed.filter(p=>p.id!==id); save(STORAGE.feed,state.feed); refreshFeedUI(); },180); }
        else { state.feed=state.feed.filter(p=>p.id!==id); save(STORAGE.feed,state.feed); }
        closeModal();
      }));
      $$("[data-admin-report-view]").forEach(btn=>btn.addEventListener("click",()=>{ const r=state.reports.find(x=>x.id===btn.dataset.adminReportView); if(!r)return; const post=state.feed.find(p=>p.id===r.postId); closeModal(); if(post){ enterEditor(post.id,true); } else if(r.graphId && getGraph(r.graphId)){ enterEditor(r.graphId,true); } else toast(t("noGraphs")); }));
      $$("[data-admin-report-delete]").forEach(btn=>btn.addEventListener("click",()=>deleteReportedGraph(btn.dataset.adminReportDelete)));
      $$("[data-admin-report-resolve]").forEach(btn=>btn.addEventListener("click",()=>resolveReport(btn.dataset.adminReportResolve,"resolved")));
      $$("[data-admin-report-reject]").forEach(btn=>btn.addEventListener("click",()=>resolveReport(btn.dataset.adminReportReject,"rejected")));
      $("[data-modal-backdrop]")?.addEventListener("click", event=>{if(event.target.dataset.modalBackdrop!==undefined)closeModal();});
      $("#report-form")?.addEventListener("submit", e=>{e.preventDefault(); submitReport(state.modal?.postId);});
      $("[data-confirm]")?.addEventListener("click",()=>{const action=state.modal?.action; if(action)action();});
      $("[data-add-row]")?.addEventListener("click",()=>{const list=$("#rows-list"); const row=document.createElement("div"); row.className="row-editor";row.innerHTML='<input class="row-key" placeholder="${t("rowField")}"><input class="row-value" placeholder="${t("rowValue")}"><button type="button" data-remove-row>×</button>';list.append(row);});
      $$("[data-remove-row]").forEach(btn=>btn.addEventListener("click",()=>{const all=$$(".row-editor"); if(all.length>1)btn.parentElement.remove();}));
      $("[data-modal-delete-node]")?.addEventListener("click",()=>{const id=$("[data-modal-delete-node]").dataset.modalDeleteNode; closeModal(); deleteNode(id);});
      $("[data-delete-edge]")?.addEventListener("click",()=>{const graph=getGraph(state.editingGraphId);if(graph){graph.edges=graph.edges.filter(e=>e.id!==$("[data-delete-edge]").dataset.deleteEdge);graph.updatedAt=now();saveGraphs();}closeModal();renderEditor(false);;});
      $("[data-export='html']")?.addEventListener("click",()=>{downloadGraphHTML();closeModal();;});
      $("[data-export='image']")?.addEventListener("click",()=>{downloadGraphImage();closeModal();});
      $("#graph-form")?.addEventListener("submit",event=>{event.preventDefault(); const title=$("#graph-name").value.trim()||"Без названия"; const graphId=state.modal.graphId; if(graphId){const graph=getGraph(graphId);graph.title=title;graph.updatedAt=now();saveGraphs();closeModal();render();toast(t("saved"));}else{const graph=makeGraph(title,0);graph.nodes=[];graph.edges=[];graph.nodes.push({id:uid("node"),type:"ordinary",title:"Первый узел",x:390,y:270,text:"Начните с добавления деталей",rows:[],media:"",collapsed:true});state.graphs.unshift(graph);saveGraphs();closeModal();enterEditor(graph.id,false);}});
      $("#node-form")?.addEventListener("submit",event=>{event.preventDefault(); saveNodeForm();});
      $("#node-type")?.addEventListener("change",()=>{const type=$("#node-type").value;$("#rows-field").style.display=["table","expandable"].includes(type)?"grid":"none";$("#media-field").style.display=type==="media"?"grid":"none";});
      $("#node-type")?.dispatchEvent(new Event("change"));
      const updateBranchPreview=()=>{const p=$("#branch-preview"); if(!p)return; p.innerHTML=`<b>${esc($("#node-title")?.value||"Новый узел")}</b><span>${esc($("#node-text")?.value||"")}</span>`;};
      $("#node-title")?.addEventListener("input",updateBranchPreview); $("#node-text")?.addEventListener("input",updateBranchPreview);
      $("#node-media-file")?.addEventListener("change",async event=>{const file=event.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{$("#node-media").value=reader.result;;};reader.readAsDataURL(file);});
    }
    function saveNodeForm() {
      const graph=getGraph(state.editingGraphId), form=$("#node-form"); if(!graph||!form)return;
      const id=form.dataset.nodeId, type=$("#node-type").value, rows=$$(".row-editor").map(row=>[$(".row-key",row).value.trim(),$(".row-value",row).value.trim()]).filter(row=>row[0]||row[1]);
      const data={type,title:$("#node-title").value.trim()||"Без названия",text:$("#node-text").value.trim(),rows,media:$("#node-media").value||"",collapsed:false};
      if(id){Object.assign(graph.nodes.find(n=>n.id===id),data);}else{
        const anchor = graph.nodes.find(n=>n.id===state.selectedNodeId) || graph.nodes[0];
        const wrap=$("#canvas-wrap");
        const cx=(wrap?.clientWidth/2-state.viewport.x)/state.viewport.scale||390, cy=(wrap?.clientHeight/2-state.viewport.y)/state.viewport.scale||270;
        let x=anchor ? anchor.x+230 : cx, y=anchor ? anchor.y+115 : cy;
        // Keep new branches visibly separated from the selected/main branch and from existing nodes.
        const minDist=185; let tries=0;
        while(graph.nodes.some(n=>Math.hypot(n.x-x,n.y-y)<minDist) && tries++<16){ const a=(tries%8)*Math.PI/4; x=(anchor?.x||cx)+Math.cos(a)*230; y=(anchor?.y||cy)+Math.sin(a)*180; }
        const newNode={id:uid("node"),x,y,...data}; graph.nodes.push(newNode);
        if(anchor) graph.edges.push({id:uid("edge"),from:anchor.id,to:newNode.id});
      }
      graph.updatedAt=now();saveGraphs();closeModal();renderEditor(false);toast(t("saved"));
    }
    function download(name, content, type) { const blob=new Blob([content],{type}), link=document.createElement("a");link.href=URL.createObjectURL(blob);link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000); }
    function downloadGraphHTML() {
      const graph=getGraph(state.editingGraphId); if(!graph)return;
      const payload=JSON.stringify(graph).replace(/</g,"\\u003c");
      const html=`<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(graph.title)}</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#0b1120;color:#edf3ff;font:14px system-ui}header{height:54px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #26344f;background:#101a30;box-sizing:border-box}h1{font-size:15px}.hint{margin-left:auto;color:#8d9ab5;font-size:11px}#c{position:absolute;inset:54px 0 0;overflow:hidden;background-image:radial-gradient(#344563 1px,transparent 1px);background-size:25px 25px;touch-action:none}#s{position:absolute;inset:0;transform-origin:0 0}.n{position:absolute;transform:translate(-50%,-50%);min-width:140px;max-width:220px;padding:12px;border:1px solid #385175;border-radius:12px;background:#15233d;box-shadow:0 10px 25px #0006;user-select:none;cursor:grab}.k{color:#8d9ab5;font-size:9px;text-transform:uppercase;margin-bottom:7px}.t{font-weight:700}.x{color:#8d9ab5;font-size:11px;line-height:1.4;margin-top:8px}svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}</style></head><body><header><h1>${esc(graph.title)}</h1><span class="hint">Перетаскивание · колесо · нажмите узел</span></header><div id="c"><div id="s"><svg id="e"></svg></div></div><script>const G=${payload},c=document.getElementById("c"),s=document.getElementById("s"),e=document.getElementById("e"),by=Object.fromEntries(G.nodes.map(n=>[n.id,n]));let v={x:0,y:0,z:1},p=null;function draw(){s.style.transform="translate("+v.x+"px,"+v.y+"px) scale("+v.z+")";e.innerHTML=G.edges.map(q=>{let a=by[q.from],b=by[q.to],d=b.x-a.x,be=Math.max(55,Math.abs(d)*.28);return "<path d='M "+a.x+" "+a.y+" C "+(a.x+be)+" "+a.y+", "+(b.x-be)+" "+b.y+", "+b.x+" "+b.y+"' fill='none' stroke='#6ee7d1' stroke-opacity='.6' stroke-width='2'/>"}).join("");s.querySelectorAll(".n").forEach(x=>x.remove());G.nodes.forEach(n=>{let x=document.createElement("div");x.className="n";x.style.left=n.x+"px";x.style.top=n.y+"px";x.innerHTML="<div class='k'>"+n.type+"</div><div class='t'>"+String(n.title).replace(/[<>&]/g,"")+"</div><div class='x'>"+String(n.text||"").replace(/[<>&]/g,"")+"</div>";x.onpointerdown=a=>{a.stopPropagation();let sx=a.clientX,sy=a.clientY,ox=n.x,oy=n.y;x.setPointerCapture(a.pointerId);x.onpointermove=b=>{n.x=ox+(b.clientX-sx)/v.z;n.y=oy+(b.clientY-sy)/v.z;draw()}};x.ondblclick=()=>alert((n.title||"")+"\\n\\n"+(n.text||"")+(n.rows||[]).map(r=>"\\n"+r[0]+": "+r[1]).join(""));s.append(x)})}c.onpointerdown=a=>{p={x:a.clientX,y:a.clientY,ox:v.x,oy:v.y};c.setPointerCapture(a.pointerId)};c.onpointermove=a=>{if(p){v.x=p.ox+a.clientX-p.x;v.y=p.oy+a.clientY-p.y;draw()}};c.onpointerup=()=>p=null;c.onwheel=a=>{a.preventDefault();let r=c.getBoundingClientRect(),f=a.deltaY<0?1.1:.9,n=v.z,nz=Math.max(.3,Math.min(2.6,n*f)),x=a.clientX-r.left,y=a.clientY-r.top;v.x=x-(x-v.x)*(nz/n);v.y=y-(y-v.y)*(nz/n);v.z=nz;draw()};draw();<\/script></body></html>`;
      download((graph.title||"graph").replace(/[^a-z0-9а-яё]+/gi,"-").toLowerCase()+".html",html,"text/html");
    }
    function downloadGraphImage() {
      const graph=getGraph(state.editingGraphId); if(!graph)return;
      const scale=3, width=1200, height=760, svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${width*scale}" height="${height*scale}" viewBox="0 0 ${width} ${height}"><rect width="100%" height="100%" fill="#0b1120"/><g opacity=".22">${Array.from({length:38},(_,i)=>`<path d="M ${i*32} 0V${height}M 0 ${i*32}H${width}" stroke="#53617e" stroke-width=".5"/>`).join("")}</g><g transform="translate(80 70)">${graph.edges.map(edge=>{const a=graph.nodes.find(n=>n.id===edge.from),b=graph.nodes.find(n=>n.id===edge.to);if(!a||!b)return"";const dx=b.x-a.x,be=Math.max(55,Math.abs(dx)*.28);return `<path d="M${a.x} ${a.y} C${a.x+be} ${a.y},${b.x-be} ${b.y},${b.x} ${b.y}" fill="none" stroke="#6ee7d1" stroke-opacity=".7" stroke-width="3"/>`}).join("")}${graph.nodes.map(n=>`<g transform="translate(${n.x} ${n.y})"><rect x="-95" y="-28" width="190" height="56" rx="12" fill="#162540" stroke="#405a82"/><circle cx="-78" cy="-8" r="5" fill="#6ee7d1"/><text x="-65" y="-4" fill="#8d9ab5" font-family="system-ui" font-size="10">${esc(nodeTypeLabel(n.type))}</text><text x="-78" y="14" fill="#edf3ff" font-family="system-ui" font-size="13" font-weight="700">${esc(n.title).slice(0,25)}</text></g>`).join("")}</g><text x="80" y="${height-30}" fill="#8d9ab5" font-family="system-ui" font-size="12">TRACE / ${esc(graph.title)}</text></svg>`;
      const img=new Image(); img.onload=()=>{const canvas=document.createElement("canvas");canvas.width=width*scale;canvas.height=height*scale;canvas.getContext("2d").drawImage(img,0,0);canvas.toBlob(blob=>{const url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download=(graph.title||"graph")+".png";link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});};img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);;
    }
    document.addEventListener("keydown", event => { if(event.key==="Escape" && state.modal) closeModal(); });
    window.matchMedia("(prefers-color-scheme: light)").addEventListener?.("change",()=>{if(state.settings.theme==="system")applyTheme();});
    render();
    bootstrapApi();
  })();
  </script>
